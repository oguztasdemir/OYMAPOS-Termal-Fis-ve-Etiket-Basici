<!-- SEKME 1: ÜRÜNLER & ETİKET MASASI (EXCEL TABLO GRİDİ) -->
<section id="tab-search" class="tab-pane">
  <div class="card" style="padding: 16px 20px;">
    <div class="card-header" style="margin-bottom: 12px; gap: 12px; flex-wrap: wrap;">
      <div class="card-title" style="font-size: 15px;">
        <span>📦 Güncel Stok & Hızlı Etiket Masası</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <div style="display:inline-flex; border:1px solid var(--border-subtle); border-radius:6px; overflow:hidden;">
          <button id="filterAllBtn" class="btn btn-secondary btn-sm active" style="border-radius:0; border:none; padding:6px 12px; font-size:12px;" onclick="toggleFilter('all')">
            Tüm Stok ( <span id="totalProductsCount">0</span> )
          </button>
          <button id="filterDiffBtn" class="btn btn-secondary btn-sm" style="border-radius:0; border:none; border-left:1px solid var(--border-subtle); padding:6px 12px; font-size:12px;" onclick="toggleFilter('diff')">
            ⚠️ Fiyat Farkı Olanlar ( <span id="diffProductsCount">0</span> )
          </button>
          <button id="filterNewBtn" class="btn btn-secondary btn-sm" style="border-radius:0; border:none; border-left:1px solid var(--border-subtle); padding:6px 12px; font-size:12px;" onclick="toggleFilter('new')">
            ✨ Yeni Eklenenler ( <span id="newProductsCount">0</span> )
          </button>
          <button id="filterBlacklistBtn" class="btn btn-secondary btn-sm" style="border-radius:0; border:none; border-left:1px solid var(--border-subtle); padding:6px 12px; font-size:12px; color:#f87171;" onclick="toggleFilter('blacklist')">
            🚫 Kara Liste ( <span id="blacklistTabCount">0</span> )
          </button>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="copyTableToClipboard('productsTable')" style="padding:6px 12px; font-size:12px;">
          📋 Kopyala
        </button>
        <a href="/api/export/products/excel" class="btn btn-secondary btn-sm" style="background:linear-gradient(135deg, #10b981, #059669); color:#fff; border:none; padding:6px 12px; font-size:12px; font-weight:700; box-shadow:0 2px 8px rgba(16,185,129,0.3);" title="Doğrudan Microsoft Excel (.xlsx) formatında indir">
          📗 Excel (.xlsx)
        </a>
        <a href="/api/export/products/csv" class="btn btn-secondary btn-sm" style="padding:6px 12px; font-size:12px;" title="Noktalı virgül ayrılmış CSV formatında indir">
          📊 CSV (.csv)
        </a>
        <a href="/api/export/products/json" class="btn btn-secondary btn-sm" style="padding:6px 12px; font-size:12px;">
          💾 JSON
        </a>
        <button class="btn btn-secondary btn-sm" onclick="syncAllLabelPrices()" style="font-weight:700; color:#38bdf8; border-color:rgba(56,189,248,0.35); background:rgba(56,189,248,0.08); padding:6px 12px; font-size:12px;" title="Tüm etiket fiyatlarını kasa satış fiyatına eşitler ve basıldı olarak onaylar">
          🏷️ Tüm Etiketleri Eşitle
        </button>
        <button class="btn btn-secondary btn-sm" onclick="toggleFilter('blacklist')" style="font-weight:700; color:#f87171; border-color:rgba(248,113,113,0.35); background:rgba(248,113,113,0.08); padding:6px 12px; font-size:12px;" title="Kara listedeki tüm ürünleri ana tabloda listele">
          🚫 Kara Liste ( <span id="blacklistProductsCount">0</span> )
        </button>
        <button class="btn btn-secondary btn-sm" onclick="openBlacklistModal()" style="font-weight:700; color:#94a3b8; border-color:rgba(148,163,184,0.25); background:rgba(148,163,184,0.06); padding:6px 10px; font-size:12px;" title="Kural filtreleri ve engelleme ayarları">
          ⚙️ Kurallar
        </button>
      </div>
    </div>

    <div class="search-bar-wrap" style="margin-bottom: 12px;">
      <input type="text" class="search-input" id="productSearchInput" placeholder="Barkod numarası veya ürün adı ile anında ara (Barkod okutunca Enter'a basar)..." oninput="handleSearchInput(event)" onkeydown="handleSearchKeydown(event)" autofocus style="padding: 10px 16px; font-size: 13px; border-radius: 8px;">
      <div class="search-shortcut-badge" style="right: 12px;">
        <kbd style="font-size: 11px; padding: 2px 6px;">Ctrl+K</kbd>
      </div>
    </div>

    <!-- Çoklu Seçim Aksiyon Çubuğu (Shift & Ctrl Destekli) -->
    <div id="productMultiSelectBar" style="display:none; align-items:center; justify-content:space-between; background:linear-gradient(135deg, #1e293b, #0f172a); border:1.5px solid #38bdf8; border-radius:8px; padding:8px 14px; margin-bottom:12px; gap:12px; flex-wrap:wrap; box-shadow:0 4px 16px rgba(56,189,248,0.15);">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:16px;">✨</span>
        <span style="font-size:13px; font-weight:800; color:#fff;">
          <strong id="multiSelectCountText" style="color:#38bdf8;">0 Ürün</strong> Seçildi
        </span>
        <span style="font-size:11.5px; color:#94a3b8;">(Aralık için <strong>Shift</strong>, tek tek için <strong>Ctrl</strong> ile satırlara tıklayın)</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button id="btnBatchAddToBlacklist" class="btn btn-secondary btn-sm" onclick="executeBatchBlacklist('add')" style="background:rgba(239,68,68,0.2); color:#fca5a5; border-color:rgba(239,68,68,0.4); font-weight:700; padding:6px 12px; font-size:12px;">
          🚫 Seçilenleri Kara Listeye Ekle
        </button>
        <button id="btnBatchRemoveFromBlacklist" class="btn btn-secondary btn-sm" onclick="executeBatchBlacklist('remove')" style="background:rgba(16,185,129,0.2); color:#34d399; border-color:rgba(16,185,129,0.4); font-weight:700; padding:6px 12px; font-size:12px;">
          ✓ Seçilenleri Kara Listeden Çıkar
        </button>
        <button class="btn btn-secondary btn-sm" onclick="clearProductSelection()" style="padding:6px 10px; font-size:12px; color:#94a3b8;">
          Seçimi Temizle (Esc)
        </button>
      </div>
    </div>

    <div class="table-container" style="max-height: calc(100vh - 220px); overflow-y: auto; overflow-x: hidden;">
      <table id="productsTable" class="table-excel">
        <colgroup>
          <col style="width: 32px;">
          <col style="width: 110px;">
          <col style="width: auto;">
          <col style="width: 90px;">
          <col style="width: 90px;">
          <col style="width: 85px;">
          <col style="width: 95px;">
          <col style="width: 105px;">
          <col style="width: 110px;">
        </colgroup>
        <thead>
          <tr>
            <th class="col-idx">#</th>
            <th class="col-barcode" onclick="sortTable('barcode')" style="cursor: pointer; user-select: none;" title="Barkoda göre sırala (A-Z / Z-A)">
              <span>Barkod</span> <span id="sort-icon-barcode" class="sort-indicator">↕️</span>
            </th>
            <th class="col-title" onclick="sortTable('title')" style="cursor: pointer; user-select: none;" title="Ürün adına göre sırala (A-Z / Z-A)">
              <span>Ürün Adı (Yazıcıda Çıkacak İsim)</span> <span id="sort-icon-title" class="sort-indicator">↕️</span>
            </th>
            <th class="col-pos-price" onclick="sortTable('price')" style="cursor: pointer; user-select: none; text-align: right;" title="Satış fiyatına göre sırala (Küçükten Büyüğe / Büyükten Küçüğe)">
              <span>Satış Fiyatı</span> <span id="sort-icon-price" class="sort-indicator">↕️</span>
            </th>
            <th class="col-label-price" onclick="sortTable('label_price')" style="cursor: pointer; user-select: none; text-align: right;" title="Etiket fiyatına göre sırala">
              <span>Etiket Fiyatı</span> <span id="sort-icon-label_price" class="sort-indicator">↕️</span>
            </th>
            <th class="col-price-date" onclick="sortTable('date')" style="cursor: pointer; user-select: none;" title="Fiyat değişim tarihine göre sırala">
              <span>Tarih</span> <span id="sort-icon-date" class="sort-indicator">↕️</span>
            </th>
            <th class="col-print-date" onclick="sortTable('print_date')" style="cursor: pointer; user-select: none;" title="Yazdırma tarihine göre sırala">
              <span>Baskı Tarihi</span> <span id="sort-icon-print_date" class="sort-indicator">↕️</span>
            </th>
            <th class="col-status" onclick="sortTable('status')" style="cursor: pointer; user-select: none;" title="Duruma göre sırala">
              <span>Durum</span> <span id="sort-icon-status" class="sort-indicator">↕️</span>
            </th>
            <th class="col-action" style="text-align: center;">İşlemler</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
          <!-- JS Dinamik Doldurur -->
        </tbody>
      </table>
    </div>
  </div>
</section>
